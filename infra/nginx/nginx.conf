map $http_authorization $rate_key {
  ""      $binary_remote_addr;
  default $http_authorization;
}
limit_req_zone $rate_key zone=per_user:10m rate=100r/m;

upstream api_gateways {
  least_conn;
  server api-gateway-1:3000 max_fails=3 fail_timeout=10s;
  server api-gateway-2:3000 max_fails=3 fail_timeout=10s;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 10m;

  location = /health {
    proxy_pass http://api_gateways/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    limit_req zone=per_user burst=20 nodelay;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_pass http://api_gateways;
  }
}
